  image: ^4.7.2
  image_cropper: ^11.0.0
  flutter_native_splash: ^2.3.7
  flutter_launcher_icons: "^0.13.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.8.0
  build_runner: ^2.4.6
  mockito: ^5.6.1

flutter_native_splash:
