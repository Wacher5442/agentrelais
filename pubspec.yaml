name: marakco
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  connectivity_plus: ^6.1.5
  drift: ^2.28.1
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  google_fonts: ^6.3.0
  flutter_spinkit: ^5.2.2
  permission_handler: ^12.0.1
  dotted_border: ^3.1.0
  flutter_svg: ^2.2.2
  sqflite: ^2.2.0
  base32: ^2.2.0
  fpdart: ^1.2.0
  internet_connection_checker_plus: ^2.7.2
  workmanager: ^0.9.0+3
